<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Overlays</title></head>
<body data-clicked="">
  <h1>Careers</h1>
  <p>Some page copy.</p>

  <!-- Cookie banner: safe to accept -->
  <div class="cookie-banner" role="dialog">
    <p>We use cookies to improve your experience.</p>
    <button type="button" onclick="document.body.dataset.clicked += 'cookie,'">Accept all cookies</button>
    <button type="button">Manage preferences</button>
  </div>

  <!-- Chat widget: safe to close -->
  <div class="chat-widget" role="dialog">
    <p>Hi! I am the career bot. How can I help?</p>
    <button type="button" aria-label="Close chat" onclick="document.body.dataset.clicked += 'chat,'">Close chat</button>
  </div>

  <!-- A modal that is not marked non-essential: must be left alone -->
  <div class="notice" role="dialog">
    <p>Important notice about your account.</p>
    <button type="button" onclick="document.body.dataset.clicked += 'notice-close,'">Close</button>
  </div>

  <!-- This dialog IS the application: its Close button must never be pressed -->
  <div class="popup" role="dialog">
    <p>Your application form</p>
    <p>Given Name(s)</p>
    <input type="text" aria-label="Given Name(s)" />
    <p>Family Name</p>
    <input type="text" aria-label="Family Name" />
    <button type="button" onclick="document.body.dataset.clicked += 'form-close,'">Close</button>
  </div>
</body>
</html>
